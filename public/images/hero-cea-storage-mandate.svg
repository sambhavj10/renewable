<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Arial, Helvetica, sans-serif">
<rect width="1200" height="675" fill="#fcfcfb"/>
<text x="70" y="78" font-size="22" letter-spacing="4" fill="#17693e" font-weight="bold">POLICY &amp; MARKETS</text>
<text x="70" y="132" font-size="44" font-family="Georgia, serif" font-weight="bold" fill="#17211b">Storage, built in from the start</text>
<text x="70" y="360" font-size="132" font-family="Georgia, serif" font-weight="bold" fill="#0f4c2c">2 &#8594; 4 hrs</text>
<text x="70" y="415" font-size="27" fill="#5d6a62">Minimum co-located storage for new solar &amp; wind — 2 hrs from 2027, 4 hrs by 2029</text>
<rect x="70" y="465" width="330" height="110" rx="8" fill="#e9f3ec"/>
<text x="94" y="513" font-size="32" font-weight="bold" fill="#0f4c2c">&#8805; 10%</text>
<text x="94" y="548" font-size="20" fill="#5d6a62">Of plant capacity, as storage</text>
<rect x="430" y="465" width="330" height="110" rx="8" fill="#e9f3ec"/>
<text x="454" y="513" font-size="32" font-weight="bold" fill="#0f4c2c">15%</text>
<text x="454" y="548" font-size="20" fill="#5d6a62">Grid-forming inverters</text>
<rect x="790" y="465" width="330" height="110" rx="8" fill="#e9f3ec"/>
<text x="814" y="513" font-size="32" font-weight="bold" fill="#0f4c2c">1 Jul 2027</text>
<text x="814" y="548" font-size="20" fill="#5d6a62">New projects onward</text>
<text x="70" y="639" font-size="19" fill="#5d6a62">Source: CEA draft 2nd Amendment Regulations, 2026 · Graphic: GreenGrid India</text>
<rect x="0" y="665" width="1200" height="10" fill="#0f4c2c"/>
</svg>
